stages:
  - test
  - build
  - scan

test:
  stage: test
  image: python:3.12-slim
  script:
    - pip install -r app/requirements-dev.txt
    - pytest app -v

ansible-check:
  stage: test
  image: python:3.12-slim
  script:
    - pip install ansible-core ansible-lint
    - ansible-playbook -i localhost, --syntax-check ansible/site.yml
    - ansible-lint ansible/ || true

build:
  stage: build
  image: docker:26
  services:
    - docker:26-dind
  variables:
    DOCKER_TLS_CERTDIR: "/certs"
  script:
    - docker login -u "$CI_REGISTRY_USER" -p "$CI_REGISTRY_PASSWORD" "$CI_REGISTRY"
    - docker build -t "$CI_REGISTRY_IMAGE/app:$CI_COMMIT_SHORT_SHA" app
    - docker push "$CI_REGISTRY_IMAGE/app:$CI_COMMIT_SHORT_SHA"

trivy-scan:
  stage: scan
  image:
    name: aquasec/trivy:0.54.1
    entrypoint: [""]
  script:
    - trivy image --exit-code 1 --severity CRITICAL --username "$CI_REGISTRY_USER" --password "$CI_REGISTRY_PASSWORD" "$CI_REGISTRY_IMAGE/app:$CI_COMMIT_SHORT_SHA"
